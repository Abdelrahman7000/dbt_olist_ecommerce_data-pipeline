  - name: seller_dim
    description: >
      Focuses on seller-related attributes, including geographic location, business type, and performance metrics, to support seller analytics and insights.
    columns:
      - name: seller_pk
        description: "seller Identifier key"
        data_tests: 
          - not_null
          - unique

      - name: seller_id
        description: "seller id created by the source."
        data_tests:
          - not_null