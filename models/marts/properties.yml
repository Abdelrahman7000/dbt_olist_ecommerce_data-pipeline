version: 2

models:    
  - name: customer_dim
    description: >
      Analytical dimension table capturing the evolving state of Olist's customer base,
      including geographic, demographic, and behavioral attributes.
    columns:
      - name: customer_pk
        description: "Customer Identifier key"
        data_tests: 
          - not_null
          - unique

      - name: customer_id
        description: "Customer Id from the source."
        data_tests:
          - not_null
  - name: payment_dim
    description: >
      Captures the payment methods and details associated with each customer, enabling analysis of payment trends and preferences.
    columns:
      - name: payment_det_pk
        description: "Payment identifier"
        data_tests: 
          - not_null
          - unique

      - name: payment_type
        description: "Available payment options"
        data_tests:
          - accepted_values:
              arguments:
                values: ['not_defined', 'boleto', 'debit_card','credit_card','voucher']

  - name: product_dim
    description: >
      Captures product related attributes.
    columns:
      - name: product_pk
        description: "product created identifier"
        data_tests: 
          - not_null
          - unique

      - name: product_id
        description: "product id generated created by the source"
        data_tests:
          - not_null
  
